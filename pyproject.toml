[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnsfips"
version = "0.1.1"
description = "Bridge between the Reticulum Network Stack and the FIPS mesh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rns>=1.5.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rnsfips = "rnsfips.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnsfips = ["data/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]
