name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q tests/test_envelope.py tests/test_fipsapi.py tests/test_fipsdns.py tests/test_units.py
      - name: Reticulum integration tests
        run: python -m pytest -q tests/test_interface.py tests/test_two_sites.py tests/test_tunnel.py tests/test_discovery.py
        timeout-minutes: 15
      - name: Package builds
        run: python -m pip install build && python -m build --sdist --wheel && ls dist/
